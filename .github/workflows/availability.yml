name: Comprobar disponibilidad de Liga AEFPY

on:
  schedule:
    # Offset away from the top of the hour; UTC, every ten minutes.
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: liga-availability
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Comprobar aplicación y base de datos
        shell: bash
        run: |
          response="$(curl --fail --silent --show-error \
            --connect-timeout 15 --max-time 90 \
            --retry 2 --retry-delay 10 --retry-max-time 220 \
            --retry-all-errors \
            https://liga-aefpy-web.onrender.com/healthz)"
          test "$response" = '{"status":"ok"}'
          echo "Liga AEFPY: aplicación y base de datos disponibles."
