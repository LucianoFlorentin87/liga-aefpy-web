name: Notifications CI
on:
  pull_request:
    paths:
      - 'prisma/**'
      - 'src/**'
      - 'package*.json'
      - '.github/workflows/notifications-ci.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/test
      DIRECT_URL: postgresql://test:test@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit fix
      - run: npm audit --json > audit-report.json || true
      - run: node -e 'const a=require("./audit-report.json"); for(const [name,v] of Object.entries(a.vulnerabilities||{})) console.log(JSON.stringify({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==="string"?x:{name:x.name,title:x.title,range:x.range})}))'
      - run: npx prisma validate
      - run: npx tsc --noEmit
      - run: npx eslint src/lib/notifications.ts src/lib/sanctions.ts src/lib/committee.ts src/app/layout.tsx src/app/admin/\(protected\)/layout.tsx src/app/admin/\(protected\)/notificaciones src/app/admin/\(protected\)/partidos/actions.ts src/app/admin/\(protected\)/sanciones/actions.ts src/app/admin/\(protected\)/inscripciones/actions.ts src/app/api/internal/notifications/send/route.ts src/components/admin/AdminShell.tsx src/lib/admin-nav.ts src/proxy.ts
      - run: npm run build
      - name: Save compatible security patches to PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          if ! git diff --quiet -- package-lock.json package.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json package.json
            git commit -m "security: apply npm audit compatible patches"
            git push origin HEAD:"$BRANCH_NAME"
          fi
