name: Entregar notificaciones AEFPY

on:
  schedule:
    # GitHub schedules can be delayed; inbox delivery does not depend on this job.
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: aefpy-notification-delivery
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require notification secret
        env:
          NOTIFICATION_JOB_SECRET: ${{ secrets.NOTIFICATION_JOB_SECRET }}
        run: |
          if [ -z "$NOTIFICATION_JOB_SECRET" ]; then
            echo "::error::Configure NOTIFICATION_JOB_SECRET in GitHub Actions and Render with the same value."
            exit 1
          fi
      - name: Send pending notifications and fixture reminders
        env:
          NOTIFICATION_JOB_SECRET: ${{ secrets.NOTIFICATION_JOB_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --connect-timeout 15 --max-time 90 --retry 2 --retry-delay 10 \
            -X POST -H "Authorization: Bearer $NOTIFICATION_JOB_SECRET" \
            -H "Content-Type: application/json" \
            https://liga-aefpy-web.onrender.com/api/internal/notifications/send \
            | node -e 'let s="";process.stdin.on("data",x=>s+=x);process.stdin.on("end",()=>{const v=JSON.parse(s);if(v.error)process.exit(1);console.log(JSON.stringify({reminders:v.reminders,sent:v.sent,attempted:v.attempted,skipped:v.skipped}))})'
